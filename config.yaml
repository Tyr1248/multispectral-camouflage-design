# 智能迷彩设计系统配置文件

app:
  name: "智能迷彩设计系统"

design:
  default_z_value: 20
  min_z_value: 1
  max_z_value: 100
  default_thickness_range: [100, 500]
  default_refractive_index_range: [1.3, 2.5]
  dynamic_solutions_per_group: 3
  crystal_variation_range: 30
  static_crystal_variation_range: 15

paths:
  data_dir: "./data"
  results_dir: "./results"
  models_dir: "./models"

spectrum:
  wavelength_range: [300, 2500]
  resolution: 1.0

camouflage:
  pattern_types: ["digital", "woodland", "urban", "desert"]
  default_pattern_type: "digital"
  texture_density_range: [0.1, 1.0]

color_input:
  min_groups: 1
  max_groups: 10
  default_groups: 3

image_input:
  single_image_mode: true
  multi_image_mode: true
  max_images_per_group: 10
  color_similarity_threshold: 30
  max_total_colors: 15